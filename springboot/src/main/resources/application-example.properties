spring.application.name=springboot
spring.security.user.name=admin
spring.security.user.password=admin

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_aps?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-built-in-alias-types=true
server.port=1234

user.defaultPassword=123456
spring.mail.host=smtp.qq.com
spring.mail.username=YOUR_EMAIL@qq.com
spring.mail.password=YOUR_EMAIL_AUTH_CODE
spring.mail.default-encoding=utf-8
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.port=587
user.fromEmail=YOUR_EMAIL@qq.com

server.servlet.context-path=/
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
spring.jackson.default-property-inclusion=non_empty

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 缓存（两级缓存：本地 Caffeine + 分布式 Redis）=====
# 本地缓存：无需外部依赖，默认即可运行演示
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
# 分布式缓存：多实例部署时取消注释切换到 Redis（需先启动 Redis）
# spring.cache.type=redis
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.password=
# spring.data.redis.timeout=3s

# AI FastAPI microservice
ai.service.base-url=http://localhost:8001
ai.service.timeout=45000

# ===== OpenAPI / Swagger 接口文档 =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===== MQ 异步下单链路（RabbitMQ）=====
# 是否启用 MQ 异步下单：true 走「Redis 预扣库存 + MQ 异步落库 + 延迟关单」；false 走同步下单（默认）
# 启用前请先：1) 启动 RabbitMQ（docker compose 已包含） 2) 执行数据库/upgrade/v3.0.0_mq_async_order.sql
app.mq.enabled=false
# 订单超时时间（分钟）：超时未支付自动取消，回补库存
app.mq.order-timeout-minutes=30
# 延迟队列 TTL（毫秒），需与分钟配置一致
app.mq.order-timeout-ms=1800000
# 超时关单兜底扫描 cron（延迟队列不可用时的最终一致性保障）
app.mq.timeout-scan-cron=0 */2 * * * ?
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# ===== 缓存三防（穿透/击穿/雪崩）=====
# 商品详情读取：布隆过滤器拦截穿透 + 互斥锁重建防击穿 + TTL 抖动防雪崩
cache.protection.enabled=true
# 布隆过滤器容量（按商品总量级配置）
cache.protection.bloom-size=20000
# 本地一级缓存 Caffeine：容量 / TTL
cache.protection.l1-size=1000
cache.protection.l1-ttl-seconds=600
# Redis 二级缓存：默认关闭（本地演示无需），多实例部署时开启
cache.protection.l2-enabled=false
cache.protection.l2-ttl-seconds=1800
# 空值缓存 TTL（秒）：穿透兜底
cache.protection.null-ttl-seconds=30
# TTL 随机抖动上限（秒）：防雪崩
cache.protection.ttl-jitter-seconds=120
