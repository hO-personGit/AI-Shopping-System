# SpringBoot 后端 Deployment + Service（Kubernetes 示例）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ai-shopping-backend:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1234
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/db_aps?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8"
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: AI_SERVICE_BASE_URL
              value: "http://ai-service:8001"
            - name: SPRING_CACHE_TYPE
              value: "caffeine"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 1234
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 1234
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 1234
      targetPort: 1234
